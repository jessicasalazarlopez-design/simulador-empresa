<title>Bitácoras PEI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: pestañas + una hoja A4 por clase, cada una con su panel de autollenado encima; segunda pestaña con el registro */
:root{
  --bg:#e9ecf1; --fg:#1b2238; --muted:#566074; --surface:#ffffff; --line2:#c9cfdb;
  --paper:#ffffff; --ink:#000000; --line:#000000;
  --label:#70ad47; --accent:#1f2a5c; --accent-ink:#ffffff;
  --panel:#eef4e8; --panel-line:#b9d3a3; --focus:#2f6fe0; --field-hover:#f1f7ec; --ok:#1f7a3d; --warn:#9a5b00;
  --font:Arial,"Liberation Sans",Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--fg:#e6e9f2;--muted:#a3abbe;--surface:#1b2130;--line2:#38415a;--accent:#dfe4f5;--accent-ink:#12172e;--panel:#1f2a1d;--panel-line:#44603a;--focus:#7aa7ff;--ok:#6fd08c;--warn:#f0b35a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--fg:#e6e9f2;--muted:#a3abbe;--surface:#1b2130;--line2:#38415a;--accent:#dfe4f5;--accent-ink:#12172e;--panel:#1f2a1d;--panel-line:#44603a;--focus:#7aa7ff;--ok:#6fd08c;--warn:#f0b35a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line2)}
.tab{background:transparent;color:var(--fg);border:0;border-radius:4px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.next{font-size:13px;color:var(--muted)}.next b{color:var(--fg);font-variant-numeric:tabular-nums}
button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:4px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--muted)}
button.sm{padding:6px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:flex}.seg button{border-radius:0;background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:13px;padding:8px 12px;border-radius:4px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);margin-bottom:12px}
.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}
.scroller{overflow-x:auto;max-width:100%}
.page{width:794px;margin:0 auto 22px}
.fill{background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;color:var(--fg);font-size:12px}
.fill label{display:flex;flex-direction:column;gap:3px;font-weight:700;min-width:0}
.fill select,.fill input{font:inherit;font-weight:400;padding:6px;border:1px solid var(--line2);border-radius:3px;background:var(--surface);color:var(--fg);min-width:0;width:100%}
.fill .t{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fill .wide{grid-column:span 2}
.fill .btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.sheet{width:794px;min-height:1123px;background:var(--paper);color:var(--ink);padding:34px 46px 24px;box-shadow:0 2px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;font-size:13px;font-family:var(--font)}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.head>img{width:290px;height:auto;display:block}
.school{display:flex;align-items:center;gap:8px;margin-top:2px}.school img{width:52px;height:52px;display:block}
.dre{font-size:9.5px;font-weight:700;line-height:1.4;color:#000;width:190px}
.dre input{font:inherit;font-weight:700;color:inherit;border:0;background:transparent;width:100%;padding:0}
h1{font-size:15px;text-align:center;margin:26px 0 14px;font-weight:700;color:#000}
.consec{margin:0 0 30px 282px;width:299px;border:1px solid var(--line);padding:5px 8px;font-size:12.5px;display:flex;gap:5px;align-items:center;color:#000}
.consec input{border:0;flex:1;min-width:0;background:transparent;color:inherit;font:inherit;font-weight:700;padding:0}
table.f{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:20px}
.f td,.f th{border:1px solid var(--line);padding:0;vertical-align:middle;color:#000}
.f td.l,.f th.l{background:var(--label);color:#000;font-weight:700;padding:3px 5px;font-size:13px}
.f th.l{text-align:center;padding:1px 5px;height:18px}
.f td.h{font-weight:700;padding:2px 6px;font-size:13px}
.f td input,.f td textarea{width:100%;display:block;border:0;background:transparent;color:#000;font:inherit;font-size:13px;padding:4px 6px;resize:none}
.f td input:hover,.f td textarea:hover{background:var(--field-hover)}
.f td textarea{min-height:22px;overflow:hidden}
.f td.n{font-weight:400}.f td.gap{height:17px}.bd{padding:0 44px}.f.g{margin-bottom:0}.f.g+.f.g{margin-top:-1px}.f td.h{font-weight:400}
.f tr.sig td{height:18px}.f tr.sig input{padding:2px 6px;font-size:12.5px}
.sec{font-weight:700;font-size:13px;margin:0 0 3px;color:#000}
.box{border:1px solid var(--line);margin-bottom:16px}.box textarea{width:100%;display:block;border:0;background:transparent;color:#000;font:inherit;font-size:13px;padding:5px 6px;resize:none;min-height:64px;overflow:hidden}
.rec{font-weight:700;font-size:13px;margin:0 0 26px;color:#000}
.foot{margin-top:auto;text-align:center;font-size:11px;color:#000;padding-top:8px}
.foot input{display:block;width:100%;text-align:center;border:0;background:transparent;color:inherit;font:inherit;padding:1px}
.foot .pg{font-size:11px;margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:6px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line2)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input,.filters select{font:inherit;font-size:14px;padding:8px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:var(--fg);min-width:0}
.filters input{flex:1 1 200px}
.tbl{overflow-x:auto;background:var(--surface);border-radius:6px;box-shadow:inset 0 0 0 1px var(--line2)}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line2)}
.pill.g{color:var(--ok)}.pill.r{color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.more{margin:10px 0;text-align:center}
@media print{
  body{background:#fff;padding:0}.top,.toolbar,.msg,.fill,.actions,.view-reg{display:none!important}
  .scroller{overflow:visible}.page{margin:0;width:auto}.sheet{box-shadow:none;page-break-after:always;width:auto;min-height:0}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabGen" aria-selected="true">Generar bitácora</button>
      <button class="tab" role="tab" id="tabReg" aria-selected="false">Registro de consecutivos</button>
    </div>
    <div class="next">Próximo consecutivo: <b id="nextLbl">…</b></div>
  </div>

  <section id="viewGen">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Tipo de bitácora">
        <button id="tipoG" type="button" aria-pressed="true">Atención a grupos</button>
        <button id="tipoR" type="button" aria-pressed="false">Atención a reunión</button>
      </div>
      <button id="newBtn" type="button" class="ghost">Nueva bitácora</button>
    </div>
    <div id="msg" class="msg" hidden></div>
    <div class="scroller"><div id="doc"></div></div>
    <div class="actions">
      <button id="addEntry" type="button" class="ghost">Agregar otra clase (nueva página)</button>
      <button id="saveBtn" type="button">Guardar en el registro</button>
      <button id="pdfBtn" type="button">Descargar PDF</button>
    </div>
  </section>

  <section id="viewReg" class="view-reg" hidden>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar por asunto, sección, número o fecha" aria-label="Buscar">
      <select id="ft" aria-label="Tipo"><option value="">Todos los tipos</option><option value="grupos">Atención a grupos</option><option value="reunion">Atención a reunión</option></select>
    </div>
    <div class="tbl"><table><thead><tr><th>N.°</th><th>Tipo</th><th>Asunto</th><th>Fecha</th><th>Atendido</th><th></th></tr></thead><tbody id="regBody"></tbody></table></div>
    <div class="more"><button id="moreBtn" type="button" class="ghost" hidden>Mostrar más</button></div>
  </section>
</div>

<script>
const CAT={"sched": [{"doc": "Ruth Rivera Rivera", "esp": "Ejecutivo Comercial y de Servicio al Cliente", "ini": "09:20 a.m.", "fin": "11:20 a.m.", "dia": "Martes", "sec": "11-3"}, {"doc": "Ricardo Molina", "esp": "Electrónica Telecomunicaciones", "ini": "12:10 m.d.", "fin": "02:10 p.m.", "dia": "Martes", "sec": "11-6"}, {"doc": "Alex Cordero Pires", "esp": "Contabilidad y Finanzas", "ini": "07:00 a.m.", "fin": "09:00 a.m.", "dia": "Miércoles", "sec": "11-3"}, {"doc": "Viviana Segura Hernández", "esp": "Secretariado Ejecutivo", "ini": "09:20 a.m.", "fin": "11:20 a.m.", "dia": "Miércoles", "sec": "11-6"}, {"doc": "Viviana Segura Hernández", "esp": "Secretariado Ejecutivo", "ini": "12:10 m.d.", "fin": "02:10 p.m.", "dia": "Miércoles tarde", "sec": "11-4"}, {"doc": "Paola Calderón Rey", "esp": "Secretariado Ejecutivo", "ini": "02:30 p.m.", "fin": "04:30 p.m.", "dia": "Miércoles", "sec": "11-5"}, {"doc": "Ruth Rivera Rivera", "esp": "Ejecutivo Comercial y de Servicio al Cliente", "ini": "09:20 a.m.", "fin": "11:20 a.m.", "dia": "Jueves", "sec": "11-1"}, {"doc": "Henry Fonseca Mora", "esp": "Instalación y Mantenimiento en Sistemas Eléctricos Industriales", "ini": "02:30 p.m.", "fin": "04:30 p.m.", "dia": "Jueves", "sec": "11-1"}, {"doc": "Alex Cordero Pires", "esp": "Contabilidad y Finanzas", "ini": "07:00 a.m.", "fin": "09:00 a.m.", "dia": "Viernes", "sec": "11-4"}, {"doc": "Minor Cordero Alvarado", "esp": "Contabilidad y Finanzas", "ini": "9:20 a.m.", "fin": "11:20 a.m.", "dia": "Viernes", "sec": "11-2"}, {"doc": "Steven Canales Sáenz", "esp": "Configuración y Soporte a Redes de Comunicación y Sistemas Operativos", "ini": "12:10 m.d.", "fin": "02:10 p.m.", "dia": "Viernes", "sec": "11-2"}, {"doc": "Leonardo Segura Jiménez", "esp": "Electrónica Industrial", "ini": "02:30 p.m.", "fin": "04:30 p.m.", "dia": "Viernes", "sec": "11-5"}], "units": ["Oportunidades de negocios", "Modelo de negocios", "Creación de empresas", "Plan de vida", "Emprendimiento e Innovación para Financistas", "Circuitos Lineales"], "acts": [{"name": "Analizar el emprendedor", "res": "1. Explicar las características esenciales e importancia del emprendimiento haciendo un uso productivo de las tecnologías.", "act": "Analizar las características de la cultura emprendedora, así como las habilidades, responsabilidades y actitudes que distinguen a una persona emprendedora.\nLos estudiantes realizan la lectura y análisis de historias de emprendedores, identificando los problemas que enfrentaron, las oportunidades detectadas y las decisiones tomadas para transformar ideas en proyectos exitosos. A partir de este análisis, se promovió la identificación de habilidades, valores y responsabilidades presentes en cada caso.\nFinalmente, propiciar un espacio de reflexión donde los estudiantes valoraron la importancia del emprendimiento en su vida personal, académica y futura proyección profesional, vinculando los aprendizajes con su propio contexto."}, {"name": "Uso creativos de un objeto", "res": "3. Utilizar técnicas creativas que permitan la generación de ideas de negocio innovadoras, brindando soluciones a las necesidades detectadas en los clientes potenciales.", "act": "Se desarrolló la actividad “Usos Creativos de un Objeto”, con el propósito de aplicar técnicas creativas para la generación de ideas de negocio innovadoras, orientadas a la solución de necesidades de clientes potenciales.\nLa dinámica consistió en la utilización de un objeto cotidiano (un trozo de tela de aproximadamente 2 metros de largo por 50 cm de ancho), el cual fue compartido entre los estudiantes de forma secuencial. Cada participante, al recibir el objeto, propuso un uso diferente e innovador, evitando repetir ideas previamente mencionadas, como parte de una técnica de pensamiento divergente.\nAl finalizar la actividad, se realizó una breve reflexión con el grupo sobre los conceptos de creatividad e innovación, destacando su importancia en la generación de ideas y en el desarrollo de soluciones con valor para el entorno."}, {"name": "Matriz de innovación", "res": "2. Examinar el mercado y su entorno, aplicando herramientas de recolección de información para la identificación de oportunidades de negocio, según las nuevas tendencias.", "act": "Examinar el mercado y su entorno mediante la identificación de necesidades, problemas y tendencias actuales.\nAplicar herramientas de recolección de información (lluvia de ideas, análisis guiado, preguntas orientadoras) para la generación de propuestas de negocio.\nGenerar ideas de emprendimiento a partir de la observación del entorno y las necesidades detectadas en los clientes potenciales.\nAnalizar cada idea propuesta considerando su nivel de innovación, existencia de mercado, demanda insatisfecha y posibilidad de generar ganancias.\nIdentificar oportunidades de negocio a partir de las nuevas tendencias y cambios en el entorno.\nClasificar las ideas de negocio mediante el uso de la matriz de innovación, según su nivel de impacto y facilidad de implementación.\nValorar el potencial de las ideas clasificadas como oportunidades de negocio viables.\nJustificar el valor de la idea seleccionada, explicando el problema que resuelve y su aporte al cliente potencial.\nReflexionar sobre la importancia de analizar el mercado como base para la toma de decisiones en el emprendimiento."}, {"name": "SCAMPER", "res": "3. Utilizar técnicas creativas que permitan la generación de ideas de negocio innovadoras, brindando soluciones a las necesidades detectadas en los clientes potenciales.", "act": "Los estudiantes, organizados en equipos de trabajo, reciben una tarjeta con una tendencia de mercado y tres tarjetas correspondientes a la técnica SCAMPER. A partir de estas, desarrollan una solución innovadora para atender una necesidad o problemática del entorno, aplicando las tres acciones asignadas de SCAMPER en el diseño de su idea de negocio. Posteriormente, elaboran un prototipo representativo y exponen su propuesta al grupo, explicando cómo aplicaron cada una de las letras asignadas en la creación de la solución y el prototipo desarrollado."}, {"name": "El cliente", "res": "2. Examinar el mercado y su entorno, aplicando herramientas de recolección de información para la identificación de oportunidades de negocio, según las nuevas tendencias.", "act": "Examinar el mercado y su entorno mediante el análisis de las características, necesidades y problemáticas de diferentes tipos de clientes.\nOrganizar equipos de trabajo para el desarrollo colaborativo de propuestas emprendedoras.\nUtilizar tarjetas de cliente como herramienta de recolección de información para identificar características, intereses, deseos y necesidades del mercado.\nDescribir el perfil del cliente asignado, considerando edad, intereses, deseos y posibles problemáticas.\nIdentificar necesidades reales del cliente potencial a partir del análisis de la información recopilada.\nGenerar ideas de productos o servicios que respondan a las necesidades detectadas en el cliente.\nSeleccionar la idea más viable considerando su potencial de innovación y respuesta al mercado.\nAnalizar cómo la propuesta seleccionada satisface las necesidades del cliente y qué valor aporta.\nReconocer otros posibles clientes potenciales a partir de la idea desarrollada.\nComunicar la propuesta de negocio explicando el cliente, el problema identificado y la solución planteada.\nReflexionar sobre la importancia de conocer el mercado y al cliente como base para la identificación de oportunidades de negocio según las nuevas tendencias."}, {"name": "Torre de papel", "res": "Fortalecer habilidades asociadas a la creatividad, innovación, trabajo colaborativo y resolución de problemas mediante el desarrollo de retos prácticos con recursos limitados.", "act": "Se desarrolló una actividad grupal orientada al fortalecimiento de la creatividad e innovación, en la cual el estudiantado fue organizado en equipos de trabajo y recibió una cantidad limitada de hojas recicladas como único material disponible. El reto consistió en diseñar y construir una torre de papel con la mayor altura posible, asegurando además estabilidad y capacidad de sostenerse por sí misma. Durante la dinámica, los participantes aplicaron estrategias de comunicación, planificación, prueba y mejora de ideas, enfrentando limitaciones de recursos similares a situaciones reales en procesos emprendedores. Posteriormente, se promovió la reflexión sobre la importancia de la creatividad, innovación, adaptación y trabajo en equipo para la generación de soluciones y desarrollo de propuestas emprendedora"}, {"name": "FODA; CAME; PESTEL", "res": "Fortalecer la capacidad de análisis estratégico, creatividad e innovación mediante la aplicación de herramientas que permitan identificar factores internos y externos que influyen en el desarrollo y viabilidad de ideas de negocio.", "act": "Se desarrolló el análisis de herramientas estratégicas como FODA, CAME y PESTEL aplicadas a ideas de negocio propuestas por el estudiantado, con el propósito de identificar fortalezas, oportunidades, debilidades, amenazas y factores del entorno que pueden influir positiva o negativamente en su desarrollo. Durante la actividad se promovió la reflexión sobre variables internas y externas relacionadas con aspectos económicos, sociales, tecnológicos, políticos y del mercado, favoreciendo la toma de decisiones, el pensamiento crítico y la construcción de propuestas emprendedoras con mayor viabilidad y adaptación al contexto."}, {"name": "Folleto de Emprendimiento", "res": "Desarrollar la capacidad de análisis estratégico, creatividad e innovación mediante la aplicación de herramientas que permitan evaluar factores internos y externos del entorno, así como fortalecer la construcción y mejora de ideas de negocio.", "act": "Se brindó acompañamiento al estudiantado en el desarrollo progresivo de sus ideas de emprendimiento mediante la aplicación de actividades del folleto Mi Ruta Emprendedora: Del Sueño a la Acción. \nDurante la lección se promovió la reflexión sobre habilidades personales, intereses, necesidades del entorno y propósito emprendedor para fortalecer la construcción de propuestas de negocio. \nAsimismo, se realizaron ejercicios de identificación del cliente ideal, análisis de competencia, justificación de la idea de negocio y evaluación de factores internos y externos mediante herramientas estratégicas como PESTEL, FODA y CAME, permitiendo valorar oportunidades, riesgos y posibilidades de mejora. \nAdemás, se facilitó material relacionado con la técnica SCAMPER para estimular la creatividad, innovación y transformación de las propuestas emprendedoras. \nAdemás de crear su primer prototipo utilizando la creatividad.\nEl proceso concluyó con el análisis de viabilidad, sostenibilidad e impacto potencial de las ideas, favoreciendo la toma de decisiones y el fortalecimiento del pensamiento emprendedor"}, {"name": "Diseño de marca", "res": "Analizar la importancia del diseño de marca mediante la creación del logo, slogan y prototipo de una idea de negocio, identificando cómo estos elementos fortalecen la identidad empresarial y comunican valor a los potenciales clientes.", "act": "Se trabaja el diseño de marca mediante la creación del logo, slogan y prototipo de la idea de negocio. Los estudiantes analizan cómo estos elementos representan la identidad de su emprendimiento y el mensaje que desean transmitir a los posibles clientes, fortaleciendo la imagen y propuesta de valor de su proyecto."}, {"name": "Google Form", "res": "", "act": "Los estudiantes elaboran una encuesta mediante Google Forms con el propósito de analizar el mercado, recopilar información sobre las necesidades, gustos y preferencias de los posibles clientes, y obtener datos que les permitan fortalecer y validar su idea de negocio."}, {"name": "Design Thinking / PMV", "res": "Aplicar la metodología Design Thinking para identificar necesidades o problemáticas del entorno escolar y desarrollar soluciones innovadoras mediante la creación, validación y mejora de un Producto Mínimo Viable (PMV).", "act": "Se desarrolla una actividad basada en la metodología Design Thinking, en la cual los estudiantes investigan necesidades o problemáticas presentes en el entorno del colegio. Posteriormente, seleccionan una situación para trabajar y aplican las cinco etapas de la metodología: empatizar, definir, idear, prototipar y testear, con el fin de generar una solución innovadora. Como parte del proceso, elaboran un Producto Mínimo Viable (PMV) para representar su propuesta, la cual exponen al grupo y someten a prueba para recibir retroalimentación y evaluar su funcionalidad."}, {"name": "Folleto de Emprendimiento (elaboración)", "res": "Aplicar los conocimientos adquiridos en emprendimiento mediante la elaboración de un folleto empresarial y el desarrollo de un prototipo, integrando herramientas de análisis y planificación que permitan evaluar la viabilidad, sostenibilidad y propuesta de valor de una idea de negocio.", "act": "Se pone en práctica los conocimientos desarrollados durante las lecciones mediante la elaboración de un folleto de emprendimiento, en el cual los estudiantes trabajan aspectos como la justificación, idea de negocio, cliente potencial, análisis PESTEL, FODA y CAME, competencia y sostenibilidad. Además, desarrollan de manera manual un prototipo representativo de su propuesta emprendedora para fortalecer la presentación y comprensión de su idea de negocio"}, {"name": "Trabajo escrito (ficha de implementación)", "res": "Construir un plan básico de implementación para su idea de negocio, mediante la validación de la propuesta de valor y el análisis de aspectos financieros, comerciales, de formalización e impacto, con el fin de fortalecer la viabilidad de su modelo de negocio.", "act": "Los estudiantes trabajarán en equipos para completar una ficha de implementación de su idea de negocio. Utilizando el modelo de negocio desarrollado previamente, deberán definir:\n\nInversión inicial requerida.\nPosibles fuentes de financiamiento.\nEstrategias de mercadeo y ventas.\nAspectos básicos de formalización del negocio.\nImpactos sociales, ambientales y en la salud integral que podría generar su emprendimiento."}, {"name": "Modelo de CANVAS", "res": "Analizar una idea de negocio mediante la aplicación del Modelo de Negocio CANVAS, identificando y proponiendo estrategias para cada uno de sus nueve bloques con el fin de valorar la viabilidad de una propuesta emprendedora.", "act": "Los estudiantes participan en una dinámica de aprendizaje por estaciones utilizando el caso empresarial. En equipos, analizan cada uno de los nueve bloques del Modelo CANVAS (segmento de clientes, propuesta de valor, canales, relación con clientes, fuentes de ingreso, recursos clave, actividades clave, socios clave y estructura de costos), respondiendo preguntas orientadoras y proponiendo estrategias para fortalecer el modelo de negocio.\n\nDurante la actividad, los grupos rotan por las diferentes estaciones, registran sus aportes y analizan situaciones planteadas mediante tarjetas sorpresa relacionadas con oportunidades, problemas, innovación, clientes y estrategias empresariales. Al finalizar, realizan una reflexión grupal sobre la coherencia y viabilidad del modelo de negocio construido."}, {"name": "CANVAS", "res": "Construir una modelo de negocio a \npartir de una idea innovadora con una \npropuesta de valor diferenciadora, \nutilizando las herramientas y \nmetodologías vigentes.", "act": "Elaborar un modelo de negocio CANVAS según la idea de negocio seleccionada, identificando los clientes, la propuesta de valor, los canales, la relación con los clientes, las actividades, los recursos, los aliados, los costos y las fuentes de ingreso."}, {"name": "PMV", "res": "Construir una modelo de negocio a \npartir de una idea innovadora con una \npropuesta de valor diferenciadora, \nutilizando las herramientas y \nmetodologías vigentes.", "act": "Investigar las necesidades del público meta según las etapas del Design Thinking, para sustentar la idea de negocio y elaborar un Producto Mínimo Viable (PMV) con apoyo de inteligencia artificial, a partir de los bocetos elaborados a mano y de la información investigada en el trabajo escrito de la idea de negocio, aplicando las etapas del Pensamiento de Diseño: empatizar, definir, idear, prototipar y evaluar."}, {"name": "Trabajo escrito (proyecto empresarial)", "res": "Elaborar el trabajo escrito del proyecto empresarial mediante la aplicación de los conocimientos establecidos en el programa de estudio, integrando de manera ordenada todo lo visto en clase.", "act": "Los estudiantes, organizados en grupos, desarrollarán los diferentes apartados del trabajo escrito aplicando los saberes del programa de estudio y utilizando las plantillas proporcionadas."}, {"name": "Revisión de trabajos escritos", "res": "Revisar los trabajos escritos de los proyectos para verificar que cumplan con los requisitos establecidos para la Expotécnica.", "act": "Revisar cada trabajo escrito utilizando la rúbrica de evaluación, registrar las observaciones y orientar a los estudiantes en las correcciones necesarias."}, {"name": "Expotécnica", "res": "Organizar y desarrollar la Expotécnica para que los estudiantes presenten sus proyectos y demuestren los conocimientos y habilidades adquiridos.", "act": "Coordinar la distribución de los proyectos, los espacios, los horarios, los jueces, las exposiciones y los recursos necesarios para realizar la Expotécnica."}], "parts": [{"n": "Alexis Rojas Álvarez", "p": "Director"}, {"n": "Mireidy Vega Marín", "p": "Subdirectora"}, {"n": "Yeudi Rodriguez Arguedas", "p": "Coordinador Técnico"}, {"n": "Bryan Guitierrez Calvo", "p": "Coordinador con la Empresa"}, {"n": "Fiorella Banvides Obando", "p": "Orientadora"}, {"n": "Fernado Cortes Monge", "p": "Promotor de Emprendimiento e Innovación"}, {"n": "Jessica Salazar López", "p": "Promotor de Emprendimiento e Innovaci const CENTRO="Colegio Técnico Profesional San Sebastián";
const JESS={n:"Jessica Salazar López",p:"Promotor de Emprendimiento e Innovación"};
const SEED_N=66;
const DKEY="bitacoras-pei-borrador-v2";
const UNIT_OF={0:"Oportunidades de negocios",1:"Oportunidades de negocios",2:"Oportunidades de negocios",3:"Oportunidades de negocios",4:"Oportunidades de negocios",13:"Modelo de negocios",14:"Modelo de negocios",15:"Modelo de negocios",16:"Modelo de negocios"};
const pad=n=>String(n).padStart(3,"0");
const consec=n=>`CTPSS-PEI-${pad(n)}-2026`;
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const fmtDate=iso=>{if(!iso)return "";const [y,m,d]=iso.split("-");return `${+d}/${+m}/${y}`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let db=null,sample=null,dl=null,rows=[],bankDb=null,nextN=SEED_N+1,tab="gen",limit=60;
let S={tipo:"grupos",docs:{}};
const fallbackBank=()=>CAT.acts.map((a,k)=>({id:"c"+k,name:a.name,unidad:UNIT_OF[k]||"",contenido:"",actividades:a.act,resultado:a.res}));
const bank=()=>bankDb&&bankDb.length?bankDb:fallbackBank();

function newClase(){return {dia:"",slot:"",centro:CENTRO,fecha:todayISO(),fechaTxt:fmtDate(todayISO()),ini:"",fin:"",carrera:"",seccion:"",unidad:"",actId:"",nombre:"",contenido:"",resultado:"",actividades:"",obs:"Ninguna",docs:[{n:"",p:"",f:""},{...JESS,f:""}]}}
function newReunion(){return {centro:CENTRO,fecha:todayISO(),fechaTxt:fmtDate(todayISO()),ini:"",fin:"",depto:"",proposito:"",asuntos:"",acuerdos:"",part:[{...JESS,f:""},...Array.from({length:7},()=>({n:"",p:"",f:""}))]}}
function newDoc(tipo){return {tipo,n:nextN,consec:consec(nextN),entries:[tipo==="grupos"?newClase():newReunion()],saved:false,dre:"CTP San Sebastián",c0:"Circuito 01",c1:"Dirección Regional San José Central",foot1:"Ubicación del Centro Educativo: San José, San Sebastián, Iglesia Católica 400 metros oeste",foot2:"Tel: 2227-1827"}}
function cur(){return S.docs[S.tipo]||(S.docs[S.tipo]=newDoc(S.tipo))}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DKEY));if(d&&d.docs)S=d}catch(e){}}
function saveDraft(){try{localStorage.setItem(DKEY,JSON.stringify(S))}catch(e){}}
function getP(o,p){p=p.replace(/^e\./,"entries.");return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){p=p.replace(/^e\./,"entries.");const ks=p.split(".");const last=ks.pop();ks.reduce((a,k)=>a[k],o)[last]=v}

/* ---------- hoja ---------- */
const I=(p,x="")=>`<input data-p="${p}" ${x}>`;
const T=p=>`<textarea data-p="${p}"></textarea>`;
function panel(e,i,n){
  const dias=[...new Set(CAT.sched.map(s=>s.dia))];
  const slots=CAT.sched.map((s,k)=>({s,k})).filter(x=>x.s.dia===e.dia);
  const b=bank();
  return `<div class="fill"><div class="t"><span>Clase ${i+1} de ${n} · una página</span>${n>1?`<button type="button" class="ghost sm" data-quit="${i}">Quitar esta clase</button>`:""}</div>
   <label>Fecha<input type="date" data-act="fecha" data-i="${i}" value="${esc(e.fecha)}"></label>
   <label>Día<select data-act="dia" data-i="${i}"><option value="">Elegir día</option>${dias.map(d=>`<option ${d===e.dia?"selected":""}>${esc(d)}</option>`).join("")}</select></label>
   <label class="wide">Grupo y docente<select data-act="slot" data-i="${i}"><option value="">${e.dia?"Elegir grupo":"Primero elige el día"}</option>${slots.map(x=>`<option value="${x.k}" ${String(x.k)===String(e.slot)?"selected":""}>${esc(x.s.sec)} · ${esc(x.s.ini)} · ${esc(x.s.doc)}</option>`).join("")}</select></label>
   <label>Unidad de estudio<select data-act="unidad" data-i="${i}"><option value="">Elegir unidad</option>${CAT.units.map(u=>`<option ${u===e.unidad?"selected":""}>${esc(u)}</option>`).join("")}</select></label>
   <label class="wide">Actividad del banco<select data-act="actId" data-i="${i}"><option value="">Elegir actividad guardada</option>${b.map(a=>`<option value="${esc(a.id)}" ${a.id===e.actId?"selected":""}>${esc(a.name)}${a.unidad?" · "+esc(a.unidad):""}</option>`).join("")}</select></label>
   <label class="wide">Nombre de la actividad<input data-p="e.${i}.nombre" placeholder="Ej.: Modelo CANVAS"></label>
   <label class="wide">Contenido<input data-p="e.${i}.contenido" placeholder="Ej.: Los nueve bloques del modelo de negocio"></label>
   <div class="btns"><button type="button" data-gen="${i}" ${sample?"":"hidden"}>Generar objetivo</button><button type="button" class="ghost" data-bank="${i}" ${db?"":"hidden"}>Guardar actividad en el banco</button></div>
  </div>`}
function sheetHead(d,title,tot,i){return `<div class="head"><img src="${LOGO}" alt="Ministerio de Educación Pública, Gobierno de Costa Rica">
   <div class="school"><div class="dre"><input data-p="dre" aria-label="Centro"><input data-p="c0" aria-label="Circuito"><input data-p="c1" aria-label="Dirección regional"></div><img src="${SHIELD}" alt="Escudo del colegio"></div></div>
  <h1>${title}</h1><div class="consec">Consecutivo: <input data-p="consec" aria-label="Consecutivo"></div>`}
function sheetFoot(d,i,tot){return `<div class="foot"><div class="pg">Página ${i+1} de ${tot}</div><div style="font-weight:700;margin-bottom:6px">${esc(d.consec)}</div><input data-p="foot1" aria-label="Ubicación"><input data-p="foot2" aria-label="Teléfono"></div>`}
function clase(e,i){const b=`e.${i}.`;return `<div class="bd">
<table class="f g"><colgroup><col style="width:16.6%"><col style="width:22%"><col style="width:15.5%"><col style="width:20.7%"><col style="width:12.9%"><col style="width:12.3%"></colgroup>
<tr style="height:36px"><td class="l" rowspan="2">Nombre del centro educativo:</td><td rowspan="2">${T(b+"centro")}</td><td class="l n" rowspan="2">Fecha</td><td rowspan="2">${I(b+"fechaTxt")}</td><td class="h">Hora Inicio</td><td>${I(b+"ini")}</td></tr>
<tr style="height:49px"><td class="h">Hora Final</td><td>${I(b+"fin")}</td></tr>
<tr style="height:51px"><td class="l">Carrera técnica/Taller exploratorio:</td><td>${T(b+"carrera")}</td><td class="l n">Sección</td><td colspan="3">${I(b+"seccion")}</td></tr>
<tr><td class="gap" colspan="6"></td></tr>
<tr style="height:159px"><td class="l">Unidad de estudio:</td><td>${T(b+"unidad")}</td><td class="l">Resultado de aprendizaje/ Objetivo:</td><td colspan="3">${T(b+"resultado")}</td></tr>
<tr style="height:108px"><td class="l">Actividades</td><td colspan="5">${T(b+"actividades")}</td></tr>
<tr style="height:33px"><td class="l">Observaciones</td><td colspan="5">${T(b+"obs")}</td></tr></table>
<table class="f g"><colgroup><col style="width:31%"><col style="width:43%"><col style="width:26%"></colgroup>
<tr><th class="l">Nombre de los docentes</th><th class="l">Puesto</th><th class="l">Firma</th></tr>
${[0,1].map(k=>`<tr class="sig" style="height:22px"><td>${I(`${b}docs.${k}.n`)}</td><td>${I(`${b}docs.${k}.p`)}</td><td>${I(`${b}docs.${k}.f`)}</td></tr>`).join("")}</table>
<p class="rec" style="margin-top:14px">Recibido Coordinación Técnica</p></div>`}
function reunion(e){const b="e.0.";return `<div class="fill"><div class="t"><span>Reunión · una página</span></div><label>Fecha<input type="date" data-act="fecha" data-i="0" value="${esc(e.fecha)}"></label></div><div class="bd">
<table class="f g" style="margin-bottom:16px"><colgroup><col style="width:16.6%"><col style="width:22%"><col style="width:15.5%"><col style="width:20.7%"><col style="width:12.9%"><col style="width:12.3%"></colgroup>
<tr style="height:36px"><td class="l" rowspan="2">Nombre del centro educativo:</td><td rowspan="2">${T(b+"centro")}</td><td class="l n" rowspan="2">Fecha</td><td rowspan="2">${I(b+"fechaTxt")}</td><td class="h">Hora de Inicio</td><td>${I(b+"ini")}</td></tr>
<tr style="height:49px"><td class="h">Hora Final</td><td>${I(b+"fin")}</td></tr>
<tr style="height:62px"><td class="l">Departamento /Institución:</td><td colspan="5">${T(b+"depto")}</td></tr></table>
<p class="sec">Propósito de la reunión:</p><div class="box">${T(b+"proposito")}</div>
<p class="sec">Asuntos tratados:</p><div class="box" style="min-height:120px">${T(b+"asuntos")}</div>
<p class="sec">Acuerdos:</p><div class="box" style="min-height:90px">${T(b+"acuerdos")}</div>
<p class="sec">Participantes:</p>
<table class="f" style="width:80%"><colgroup><col style="width:42%"><col style="width:34%"><col style="width:24%"></colgroup>
<tr><th class="l" style="background:#d9d9d9">Nombre</th><th class="l" style="background:#d9d9d9">Puesto</th><th class="l" style="background:#d9d9d9">Firma</th></tr>
${e.part.map((_,k)=>`<tr class="sig"><td>${I(`${b}part.${k}.n`,'list="partList"')}</td><td>${I(`${b}part.${k}.p`)}</td><td>${I(`${b}part.${k}.f`)}</td></tr>`).join("")}</table>
<div style="margin:-10px 0 14px" class="noprint"><button type="button" class="ghost sm" id="addPart">Agregar participante</button></div>
<p class="rec">VB y Sello de<br>Dirección.</p></div>`}
function render(){
  const d=cur(),g=d.tipo==="grupos",n=d.entries.length;
  d.entries.forEach(x=>{if(x.fechaTxt==null)x.fechaTxt=fmtDate(x.fecha)});
  document.getElementById("tipoG").setAttribute("aria-pressed",g);
  document.getElementById("tipoR").setAttribute("aria-pressed",!g);
  document.getElementById("addEntry").hidden=!g;
  document.getElementById("pdfBtn").disabled=false;
  const title=g?"BITÁCORA DE ATENCIÓN A GRUPOS EMPRENDIMIENTO E INNOVACIÓN":"BITÁCORA DE ATENCIÓN A REUNIÓN EMPRENDIMIENTO E INNOVACIÓN";
  document.getElementById("doc").innerHTML=d.entries.map((e,i)=>`<div class="page">${g?panel(e,i,n):""}<section class="sheet">${sheetHead(d,title)}${g?clase(e,i):reunion(e)}${sheetFoot(d,i,n)}</section></div>`).join("")+
   `<datalist id="partList">${CAT.parts.map(p=>`<option value="${esc(p.n)}">`).join("")}</datalist>`;
  document.querySelectorAll("#doc [data-p]").forEach(el=>{el.value=getP(d,el.dataset.p)??""});
  document.querySelectorAll("#doc textarea").forEach(grow);
}
function grow(t){t.style.height="auto";t.style.height=Math.max(t.closest(".box")?64:22,t.scrollHeight)+"px"}
function msg(t,cls=""){const m=document.getElementById("msg");if(!t){m.hidden=true;return}m.hidden=false;m.className="msg "+cls;m.textContent=t}

const docEl=document.getElementById("doc");
docEl.addEventListener("input",ev=>{
  const el=ev.target;if(!el.dataset.p)return;
  const d=cur();setP(d,el.dataset.p,el.value);
  if(el.tagName==="TEXTAREA")grow(el);
  if(el.dataset.p==="consec"){d.touched=true;const m=el.value.match(/PEI-(\d+)-/);if(m)d.n=+m[1];document.querySelectorAll("#doc .foot div[style]").forEach(x=>x.textContent=el.value);document.querySelectorAll('#doc [data-p="consec"]').forEach(o=>{if(o!==el)o.value=el.value})}
  if(["dre","c0","c1","foot1","foot2"].includes(el.dataset.p))document.querySelectorAll(`#doc [data-p="${el.dataset.p}"]`).forEach(o=>{if(o!==el)o.value=el.value});
  d.saved=false;
  if(/part\.\d+\.n$/.test(el.dataset.p)){const k=CAT.parts.find(p=>p.n===el.value);if(k){const pp=el.dataset.p.replace(/\.n$/,".p");const pe=document.querySelector(`[data-p="${pp}"]`);if(pe&&!pe.value){pe.value=k.p;setP(d,pp,k.p)}}}
  saveDraft();
});
docEl.addEventListener("change",ev=>{
  const el=ev.target,a=el.dataset.act;if(!a)return;
  const d=cur(),e=d.entries[+el.dataset.i],v=el.value;
  if(a==="fecha"){e.fecha=v;e.fechaTxt=fmtDate(v)}
  if(a==="dia"){e.dia=v;e.slot=""}
  if(a==="slot"){e.slot=v;if(v!==""){const s=CAT.sched[+v];e.seccion=s.sec;e.carrera=s.esp;e.ini=s.ini;e.fin=s.fin;e.docs[0]={n:s.doc,p:"Docente de Especialidad",f:""}}}
  if(a==="unidad")e.unidad=v;
  if(a==="actId"){e.actId=v;const x=bank().find(z=>z.id===v);if(x){e.nombre=x.name;e.contenido=x.contenido||e.contenido;e.actividades=x.actividades||"";e.resultado=x.resultado||"";if(x.unidad&&!e.unidad)e.unidad=x.unidad}}

});
docEl.addEventListener("click",async ev=>{
  const t=ev.target,d=cur();
  if(t.id==="addPart"){d.entries[0].part.push({n:"",p:"",f:""});saveDraft();render();return}

document.getElementById("addEntry").onclick=()=>{const d=cur();const last=d.entries[d.entries.length-1];const e=newClase();e.fecha=last.fecha;e.fechaTxt=last.fechaTxt;e.obs=last.obs;d.entries.push(e);d.saved=false;saveDraft();render();msg(`Se agregó la clase ${d.entries.length} como una página nueva con el mismo consecutivo.`,"ok")};
for(const [id,t] of [["tipoG","grupos"],["tipoR","reunion"]])document.getElementById(id).onclick=()=>{S.tipo=t;msg("");saveDraft();render()};
document.getElementById("newBtn").onclick=()=>{S.docs[S.tipo]=newDoc(S.tipo);msg("");saveDraft();render()};

/* ---------- objetivo con Claude ---------- */
async function genObjetivo(i,btn){
  const e=cur().entries[i];
  if(!sample){msg("La generación con Claude no está disponible en esta vista.","warn");return}
  if(!e.unidad&&!e.nombre&&!e.contenido&&!e.actividades){msg("Completa al menos la unidad, el contenido o las instrucciones de la actividad.","warn");return}
  const ej=bank().filter(a=>a.resultado).slice(0,4).map(a=>"- "+a.resultado.replace(/\s+/g," ")).join("\n");
  const prompt=`Eres docente de Emprendimiento e Innovación de un colegio técnico profesional de Costa Rica. Redacta el "Resultado de aprendizaje/Objetivo" de una bitácora de clase.
Datos de la clase:
- Unidad de estudio: ${e.unidad||"(no indicada)"}
- Especialidad del grupo: ${e.carrera||"(no indicada)"}
- Nombre de la actividad: ${e.nombre||"(no indicado)"}
- Contenido: ${e.contenido||"(no indicado)"}
- Instrucciones de la actividad (lo que hacen los estudiantes): ${e.actividades||"(no indicadas)"}
Reglas: una sola oración de 25 a 45 palabras, en español, que inicie con un verbo en infinitivo (por ejemplo "Construir", "Analizar", "Aplicar"), ligada a la unidad, el contenido y la actividad, sin inventar datos que no estén en las instrucciones.
Ejemplos del estilo usado en el colegio:
${ej}
Responde solo con JSON: {"resultado":"..."}`;
  btn.disabled=true;const old=btn.textContent;btn.textContent="Generando…";
  try{const r=await sample.json(prompt);if(r&&r.resultado){e.resultado=String(r.resultado).trim();cur().saved=false;saveDraft();render();msg("Objetivo generado. Puedes editarlo directamente en la hoja.","ok");return}
    msg("Claude no devolvió un objetivo. Intenta de nuevo.","warn")}
  catch(err){msg(err&&err.code==="rate_limited"?"Hay demasiadas solicitudes seguidas. Espera un momento.":"No se pudo generar el objetivo.","warn")}
  btn.disabled=false;btn.textContent=old;
}

/* ---------- banco de actividades ---------- */
async function saveBank(i,btn){
  const e=cur().entries[i];
  if(!db){msg("El banco no está disponible en esta vista.","warn");return}
  const name=(e.nombre||"").trim();
  if(!name){msg("Escribe el nombre de la actividad para guardarla en el banco.","warn");return}
  if(!e.actividades.trim()){msg("Escribe las instrucciones en el campo Actividades de la hoja antes de guardarla.","warn");return}
  const same=(bankDb||[]).find(a=>a.name.toLowerCase()===name.toLowerCase()&&(a.unidad||"")===(e.unidad||""));
  const data={name,unidad:e.unidad||"",contenido:e.contenido||"",actividades:e.actividades,resultado:e.resultado||""};
  btn.disabled=true;
  try{let id;if(same){id=same.id;await db.doc("actividades/"+id).set(data)}else{const ref=await db.collection("actividades").add(data);id=ref.id}
    e.actId=id;saveDraft();msg(`Actividad "${name}" guardada en el banco. Ya aparece en la lista de actividades.`,"ok")}
  catch(err){msg("No se pudo guardar la actividad.","warn")}
  btn.disabled=false;
}

/* ---------- registro ---------- */
function asuntoOf(d,e){if(d.tipo==="reunion")return (e.proposito||"").replace(/\s+/g," ").slice(0,90);return [e.unidad,e.nombre].filter(Boolean).join(" · ")}
document.getElementById("saveBtn").onclick=async()=>{
  const d=cur();
  if(!db){msg("El registro no está disponible en esta vista. La bitácora queda como borrador en este navegador.","warn");return}
  const m=(d.consec||"").match(/PEI-(\d+)-/);if(!m){msg("El consecutivo debe tener el formato CTPSS-PEI-067-2026.","warn");return}
  d.n=+m[1];const key=pad(d.n);const btn=document.getElementById("saveBtn");btn.disabled=true;
  try{
    await db.doc("hojas/"+key).set({n:d.n,tipo:d.tipo,doc:JSON.stringify(d),updated:new Date().toISOString()});
    for(let i=0;i<d.entries.length;i++){const e=d.entries[i];
      await db.doc(`bitacoras/${key}-${i+1}`).set({n:d.n,tipo:d.tipo,asunto:asuntoOf(d,e),iso:e.fecha||"",txt:"",atendido:d.tipo==="grupos"?(e.seccion||""):"",hoja:key})}
    for(let i=d.entries.length+1;i<=8;i++){try{await db.doc(`bitacoras/${key}-${i}`).delete()}catch(e){}}
    d.saved=true;saveDraft();msg(`Bitácora ${d.consec} guardada en el registro (${d.entries.length} ${d.entries.length===1?"página":"páginas"}).`,"ok");
  }catch(err){msg("No se pudo guardar: "+(err&&err.message||"error desconocido"),"warn")}
  btn.disabled=false;
};
/* ---------- PDF: una página por clase ---------- */
document.getElementById("pdfBtn").onclick=async()=>{
  const d=cur(),btn=document.getElementById("pdfBtn");
  if(!window.html2canvas||!window.jspdf){msg("No se cargó el generador de PDF. Revisa la conexión y recarga la página.","warn");return}
  btn.disabled=true;const old=btn.textContent;btn.textContent="Generando PDF…";
  try{
    const sheets=[...document.querySelectorAll("#doc .sheet")];
    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",orientation:"portrait"});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    for(let i=0;i<sheets.length;i++){
      const idx=i;
      const c=await html2canvas(sheets[i],{scale:2,backgroundColor:"#ffffff",useCORS:true,onclone:(doc)=>{
        // los campos de texto se dibujan como texto con saltos de línea para que no se corten en el PDF
        const sh=doc.querySelectorAll("#doc .sheet")[idx];
        sh.querySelectorAll("textarea,input").forEach(el=>{
          const cs=doc.defaultView.getComputedStyle(el),d=doc.createElement("div");
          d.textContent=el.value;
          d.style.cssText=`font:${cs.font};color:#000;padding:${cs.padding};text-align:${cs.textAlign};white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;width:100%;box-sizing:border-box;min-height:${el.tagName==="TEXTAREA"?"0":"auto"}`;
          el.replaceWith(d)});
      }});
      if(i>0)pdf.addPage();
      const k=Math.min(W/c.width,H/c.height);
      pdf.addImage(c.toDataURL("image/jpeg",0.93),"JPEG",0,0,c.width*k,c.height*k);
    }
    const blob=pdf.output("blob");
    const ok=`PDF de ${sheets.length} ${sheets.length===1?"página":"páginas"} listo: una clase por página.`;
    if(dl){await dl.save({filename:`${d.consec}.pdf`,data:blob});msg(ok,"ok")}
    else{ // archivo abierto fuera de Claude (por ejemplo desde Descargas): descarga normal del navegador
      const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`${d.consec}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);msg(ok+" Revisa tu carpeta de Descargas.","ok")}
  }catch(err){if(!(err&&err.code==="declined"))msg("No se pudo generar el PDF"+(err&&err.code?` (${err.code})`:"")+".","warn")}
  btn.disabled=false;btn.textContent=old;
};

function tipoLbl(t){return t==="reunion"?"Reunión":"Grupos"}
function recompute(){
  let mx=SEED_N;rows.forEach(r=>{if(r.n>mx)mx=r.n});
  nextN=mx+1;document.getElementById("nextLbl").textContent=consec(nextN);
  for(const k of Object.keys(S.docs)){const d=S.docs[k];if(!d.saved&&!d.touched&&d.n<nextN&&d.consec===consec(d.n)){d.n=nextN;d.consec=consec(nextN)}}
}
function renderReg(){
  const q=document.getElementById("q").value.trim().toLowerCase(),ft=document.getElementById("ft").value;
  const all=rows.slice().sort((a,b)=>b.n-a.n||String(b.id).localeCompare(String(a.id)));
  const list=all.filter(r=>(!ft||r.tipo===ft)&&(!q||[consec(r.n),r.asunto,r.atendido,r.txt,fmtDate(r.iso)].join(" ").toLowerCase().includes(q)));
  const g=rows.filter(r=>r.tipo==="grupos").length,re=rows.filter(r=>r.tipo==="reunion").length;
  document.getElementById("stats").innerHTML=`<div class="stat"><b>${rows.length}</b><span>Filas en el registro</span></div><div class="stat"><b>${g}</b><span>Atención a grupos</span></div><div class="stat"><b>${re}</b><span>Atención a reunión</span></div><div class="stat"><b>${pad(nextN)}</b><span>Próximo número</span></div>`;
  const body=document.getElementById("regBody");
  if(!list.length){body.innerHTML=`<tr><td colspan="6" class="empty">${rows.length?"Ninguna bitácora coincide con la búsqueda.":"El registro está vacío. Cuando guardes una bitácora aparecerá aquí."}</td></tr>`;document.getElementById("moreBtn").hidden=true;return}
  body.innerHTML=list.slice(0,limit).map(r=>`<tr><td>${consec(r.n)}</td><td><span class="pill ${r.tipo==="reunion"?"r":"g"}">${tipoLbl(r.tipo)}</span></td><td>${esc(r.asunto)||"—"}</td><td>${esc(r.txt||fmtDate(r.iso))||"—"}</td><td>${esc(r.atendido)||"—"}</td><td>${r.hoja?`<button class="ghost sm" data-open="${esc(r.hoja)}">Abrir</button>`:""}</td></tr>`).join("");
  const mb=document.getElementById("moreBtn");mb.hidden=list.length<=limit;mb.textContent=`Mostrar más (${list.length-limit})`;
}
document.getElementById("regBody").addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-open]");if(!b||!db)return;
  try{const s=await db.doc("hojas/"+b.dataset.open).get();if(!s.exists)return;
    const d=JSON.parse(s.data().doc);d.saved=true;S.tipo=d.tipo;S.docs[d.tipo]=d;saveDraft();setTab("gen");render();msg(`Abierta la bitácora ${d.consec}. Si la cambias, vuelve a guardarla.`,"ok")}catch(e){msg("No se pudo abrir la bitácora.","warn")}
});
document.getElementById("q").oninput=()=>{limit=60;renderReg()};
document.getElementById("ft").onchange=()=>{limit=60;renderReg()};
document.getElementById("moreBtn").onclick=()=>{limit+=60;renderReg()};
function setTab(t){tab=t;document.getElementById("viewGen").hidden=t!=="gen";document.getElementById("viewReg").hidden=t!=="reg";
  document.getElementById("tabGen").setAttribute("aria-selected",t==="gen");document.getElementById("tabReg").setAttribute("aria-selected",t==="reg");if(t==="reg")renderReg()}
document.getElementById("tabGen").onclick=()=>setTab("gen");
document.getElementById("tabReg").onclick=()=>setTab("reg");


/* ---------- respaldo local: cuando la página corre fuera de Claude (por ejemplo en GitHub Pages) ---------- */
function makeLocalDb(){
  const K="bitacoras-pei-local-v1";let st={bitacoras:{},hojas:{},actividades:{}};
  try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.bitacoras)st=s}catch(e){}
  const persist=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
  if(!st.seeded){
    (CAT.seed||[]).forEach(r=>{st.bitacoras[r.id]={n:r.n,tipo:r.tipo,asunto:r.asunto,iso:r.iso,txt:r.txt,atendido:r.atendido}});
    fallbackBank().forEach(a=>{const {id,...d}=a;st.actividades[id]=d});st.seeded=1;persist()}
  const subs={bitacoras:[],actividades:[]};
  const snap=c=>({docs:Object.entries(st[c]).map(([id,d])=>({id,data:()=>d}))});
  const emit=c=>(subs[c]||[]).forEach(f=>f(snap(c)));
  return {
    doc(p){const [c,id]=p.split("/");return {
      async set(d){st[c][id]=d;persist();emit(c)},
      async get(){const d=st[c][id];return {exists:!!d,data:()=>d}},
      async delete(){delete st[c][id];persist();emit(c)}}},
    collection(c){return {
      async add(d){const id="l"+Date.now().toString(36);st[c][id]=d;persist();emit(c);return {id}},
      onSnapshot(f){(subs[c]=subs[c]||[]).push(f);setTimeout(()=>f(snap(c)),0);return()=>{}}}}
  };
}

loadDraft();recompute();render();
(async()=>{
  try{sample=await claude.use("sample")}catch(e){sample=null}
  try{dl=await claude.use("downloads")}catch(e){dl=null}
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){db=makeLocalDb();msg("Esta versión guarda el registro y las actividades en este navegador.","ok")}
  render();
  db.collection("actividades").onSnapshot(s=>{bankDb=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.name.localeCompare(b.name,"es"));
    const a=document.activeElement;if(!(a&&a.closest&&a.closest("#doc")&&["INPUT","TEXTAREA"].includes(a.tagName)))render()},()=>{});
  db.collection("bitacoras").onSnapshot(s=>{rows=s.docs.map(x=>({id:x.id,...x.data()}));recompute();
    const ci=document.querySelector('#doc [data-p="consec"]');const d=cur();
    if(ci&&document.activeElement!==ci&&!d.saved&&!d.touched&&ci.value!==d.consec){render()}
    if(tab==="reg")renderReg()},()=>msg("No se pudo leer el registro.","warn"));
})();
